<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Ruang Rasa</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-login-body">

<div class="admin-login-bg-pattern"></div>

<div class="admin-login-card">
  <div class="admin-login-pill">✦ ADMIN PANEL ✦</div>

  <div class="admin-login-logo">
    <img src="../public/images/remove.png" alt="Logo" onerror="this.style.display='none'">
    <h1>Ruang Rasa</h1>
    <p>Masuk sebagai administrator</p>
  </div>

  <div id="err" class="admin-login-err"></div>

  <div class="admin-login-field">
    <label>Email Admin</label>
    <div class="input-wrap">
      <input type="email" id="email" placeholder="admin@ruangrasa.com" autocomplete="email">
    </div>
  </div>

  <div class="admin-login-field">
    <label>Password</label>
    <div class="input-wrap">
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
      <button class="toggle-pass" id="toggleBtn" onclick="togglePassword()" type="button" title="Tampilkan password">
        <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
  </div>

  <button class="admin-login-btn" id="btnLogin" onclick="login()">Masuk ke Dashboard</button>

  <a href="../index.html" class="admin-login-back">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Kembali ke website
  </a>
</div>

<script>
  if (sessionStorage.getItem('rr_admin')) location.href = 'dashboard.html';

  function togglePassword() {
    const input  = document.getElementById('pass');
    const eyeOn  = document.getElementById('iconEye');
    const eyeOff = document.getElementById('iconEyeOff');
    const isHidden = input.type === 'password';
    input.type        = isHidden ? 'text' : 'password';
    eyeOn.style.display  = isHidden ? 'none'  : 'block';
    eyeOff.style.display = isHidden ? 'block' : 'none';
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('pass').value;
    const err   = document.getElementById('err');
    const btn   = document.getElementById('btnLogin');
    err.style.display = 'none';
    if (!email || !pass) {
      err.textContent   = 'Email dan password wajib diisi!';
      err.style.display = 'block';
      return;
    }
    btn.disabled    = true;
    btn.textContent = 'Masuk...';
    try {
      const res  = await fetch('../api/admin.php?action=login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password: pass })
      });
      const json = await res.json();
      if (json.success) {
        sessionStorage.setItem('rr_admin', JSON.stringify(json.admin));
        location.href = 'dashboard.html';
      } else {
        err.textContent   = json.message || 'Login gagal';
        err.style.display = 'block';
        btn.disabled      = false;
        btn.textContent   = 'Masuk ke Dashboard';
      }
    } catch (e) {
      err.textContent   = 'Gagal menghubungi server.';
      err.style.display = 'block';
      btn.disabled      = false;
      btn.textContent   = 'Masuk ke Dashboard';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
