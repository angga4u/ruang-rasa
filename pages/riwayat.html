<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat – Ruang Rasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-1 py-10 px-4">
    <div class="max-w-3xl mx-auto">

      <h1 class="text-2xl md:text-3xl font-bold mb-2" style="font-family:'Playfair Display',serif; color: var(--text-dark);">
        Riwayat Ceritaku
      </h1>
      <p id="welcomeMsg" class="text-sm mb-8" style="color: var(--text-medium);"></p>

      <!-- Loading -->
      <div id="loadingState" class="text-center py-16">
        <p class="text-3xl mb-3 animate-pulse">🌸</p>
        <p class="text-sm" style="color: #aaa;">Memuat riwayat...</p>
      </div>

      <!-- List -->
      <div id="riwayatList" class="hidden"></div>

      <!-- Empty state -->
      <div id="emptyState" class="hidden text-center py-16">
        <p class="text-5xl mb-4">📖</p>
        <p class="text-lg font-bold mb-2" style="color: var(--text-medium);">Belum ada cerita</p>
        <p class="text-sm mb-6" style="color: #999;">Yuk, mulai bagikan ceritamu!</p>
        <a href="../pages/mulai-curhat.html" class="btn-primary">Mulai Curhat</a>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../js/components.js"></script>
  <script>
    initPage('riwayat');

    const user    = JSON.parse(localStorage.getItem('rr_user') || '{}');
    const initial = (user.nama_panggilan || user.email || 'A')[0].toUpperCase();

    setTimeout(() => {
      const avatarEl = document.getElementById('avatarInitial');
      if (avatarEl) avatarEl.textContent = initial;
    }, 50);

    // Tampilkan nama user
    const welcomeEl = document.getElementById('welcomeMsg');
    if (user.nama_panggilan || user.email) {
      welcomeEl.textContent = 'Halo, ' + (user.nama_panggilan || user.email) + ' 👋';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function statusColor(status) {
      if (status === 'diterbitkan') return '#2e7d32';
      if (status === 'dimoderasi')  return '#f57c00';
      return '#1565c0';
    }

    async function renderRiwayat() {
      const list    = document.getElementById('riwayatList');
      const empty   = document.getElementById('emptyState');
      const loading = document.getElementById('loadingState');

      // Kalau tidak login, tampilkan pesan
      if (!user.id) {
        loading.classList.add('hidden');
        empty.classList.remove('hidden');
        document.querySelector('#emptyState p.text-lg').textContent = 'Kamu belum login';
        document.querySelector('#emptyState p.text-sm').textContent = 'Login dulu untuk melihat riwayat ceritamu';
        document.querySelector('#emptyState a').href = '../pages/login.html';
        document.querySelector('#emptyState a').textContent = 'Login Sekarang';
        return;
      }

      // Ambil cerita milik user dari database
      const stories = await DB.getMyStories(user.id);

      loading.classList.add('hidden');

      if (!stories.length) {
        empty.classList.remove('hidden');
        return;
      }

      list.classList.remove('hidden');
      list.innerHTML = stories.map(story => `
        <div class="story-card mb-5 animate-fade-up">
          <div class="card-meta">
            <span>Status: <strong style="color: ${statusColor(story.status)}">${story.status || 'terkirim'}</strong></span>
            <span>${timeAgo(story.created_at)}</span>
          </div>
          ${story.judul ? `<h2 class="card-title">${escapeHtml(story.judul)}</h2>` : ''}
          <p class="card-excerpt">${escapeHtml((story.isi || '').substring(0, 150))}${story.isi && story.isi.length > 150 ? '...' : ''}</p>
          <div class="flex items-center justify-between mt-2">
            <a href="detail-cerita.html?id=${story.id}" class="read-more">
              Baca selengkapnya
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            <div class="flex items-center gap-3 text-sm" style="color: #999;">
              <span>💗 ${story.likes || 0}</span>
              <span>💬 ${story.dukungan_count || 0}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    renderRiwayat();
  </script>
</body>
</html>
